[project]
name = "experiment-autopsy"
version = "0.2.0"
description = "A trust audit toolkit for A/B testing programs: peeking, power/MDE, SRM, CUPED, mSPRT, multiple comparisons, novelty detection."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["experiment_autopsy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
