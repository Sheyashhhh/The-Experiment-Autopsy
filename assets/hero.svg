<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Experiment Autopsy — A/B testing reliability</title>
<desc id="desc">Dark technical banner with statistical charts, hypothesis testing and experiment diagnostics.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#101827"/><stop offset="100%" stop-color="#172554"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#a5b4fc"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".12" stroke-width="1"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<circle cx="1010" cy="70" r="160" fill="#6366f1" opacity=".10"/>
<circle cx="1120" cy="310" r="190" fill="#06b6d4" opacity=".08"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="68" y="82" font-size="16" font-weight="700" letter-spacing="4" fill="#67e8f9">EXPERIMENTATION • STATISTICAL RELIABILITY</text>
  <text x="64" y="157" font-size="56" font-weight="800" fill="#f8fafc">EXPERIMENT</text>
  <text x="64" y="218" font-size="56" font-weight="800" fill="#f8fafc">AUTOPSY<tspan fill="#67e8f9">.</tspan></text>
  <text x="68" y="264" font-size="20" fill="#cbd5e1">Can you trust the winner?</text>
  <text x="68" y="306" font-size="14" fill="#94a3b8">POWER  /  SRM  /  CUPED  /  MULTIPLE TESTING  /  SEQUENTIAL MONITORING</text>
</g>
<g transform="translate(760 68)">
  <rect x="0" y="0" width="365" height="226" rx="18" fill="#0b1220" fill-opacity=".68" stroke="#64748b" stroke-opacity=".5"/>
  <path d="M30 45H335M30 90H335M30 135H335M30 180H335" stroke="#94a3b8" stroke-opacity=".17"/>
  <path d="M30 24V190M95 24V190M160 24V190M225 24V190M290 24V190" stroke="#94a3b8" stroke-opacity=".12"/>
  <path d="M30 164 C58 154 72 146 95 150 S140 126 160 132 S204 96 225 108 S268 60 290 72 S318 44 335 48" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M30 177 C65 174 76 169 95 171 S140 162 160 167 S202 153 225 158 S270 146 290 151 S320 137 335 140" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/>
  <circle cx="290" cy="72" r="6" fill="#67e8f9" stroke="#0b1220" stroke-width="3"/>
  <rect x="246" y="12" width="92" height="25" rx="12.5" fill="#164e63" stroke="#22d3ee" stroke-opacity=".7"/>
  <text x="292" y="29" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#cffafe">SIMULATED</text>
  <g transform="translate(30 202)">
    <circle cx="4" cy="0" r="4" fill="#67e8f9"/><text x="15" y="4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#cbd5e1">Observed effect</text>
    <circle cx="150" cy="0" r="4" fill="#f59e0b"/><text x="161" y="4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#cbd5e1">Reference</text>
  </g>
</g>
</svg>